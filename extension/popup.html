<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>Gemini Web Bridge</title>
    <style>
      body {
        min-width: 260px;
        margin: 0;
        padding: 14px;
        font: 13px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #202124;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 15px;
      }

      .row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 6px 0;
      }

      .value {
        color: #5f6368;
        text-align: right;
        word-break: break-all;
      }

      .ok {
        color: #137333;
      }

      .bad {
        color: #b3261e;
      }

      label {
        display: block;
        margin-top: 10px;
        color: #5f6368;
      }

      input {
        box-sizing: border-box;
        width: 100%;
        margin-top: 4px;
        padding: 6px;
        border: 1px solid #dadce0;
        border-radius: 6px;
        font: inherit;
      }

      button {
        width: 100%;
        margin-top: 8px;
        padding: 7px;
        border: 0;
        border-radius: 6px;
        background: #1a73e8;
        color: white;
        font: inherit;
        cursor: pointer;
      }

      .section-title {
        margin: 14px 0 6px;
        font-size: 12px;
        color: #5f6368;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      #history {
        margin-top: 6px;
        max-height: 320px;
        overflow: auto;
        border-top: 1px solid #e8eaed;
        padding-top: 8px;
      }

      .history-empty {
        color: #5f6368;
        padding: 8px 0;
      }

      .history-item {
        padding: 8px 0;
        border-bottom: 1px solid #f1f3f4;
      }

      .history-meta {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 11px;
        color: #5f6368;
      }

      .history-prompt {
        margin-top: 4px;
        color: #202124;
        word-break: break-word;
      }

      .history-files {
        margin-top: 6px;
        font-size: 11px;
        color: #5f6368;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <h1>Gemini Web Bridge</h1>
    <div class="row">
      <span>Bridge</span>
      <span id="status" class="value">checking</span>
    </div>
    <div class="row">
      <span>URL</span>
      <span id="url" class="value"></span>
    </div>
    <button id="refresh">Refresh</button>
    <div class="row">
      <span>Mode</span>
      <span id="mode" class="value">polling</span>
    </div>
    <div class="row">
      <span>Gemini page</span>
      <span id="page" class="value">checking</span>
    </div>
    <div class="row">
      <span>Expected</span>
      <span id="expected-version" class="value">checking</span>
    </div>
    <div class="row">
      <span>Active</span>
      <span id="active-version" class="value">checking</span>
    </div>
    <div class="row">
      <span>Ignored</span>
      <span id="ignored-version" class="value">checking</span>
    </div>
    <div class="section-title">Recent Tasks</div>
    <div id="history" aria-live="polite">
      <div class="history-empty">Loading history…</div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
